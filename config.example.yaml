blog:
    nav_bar:
        links:
            - type: internal
              href: "/"
              label: home
            - type: internal
              href: "/board"
              label: board
            - type: internal
              href: "/sharings"
              label: sharings
        website_information:
            title: Mou1ght
            icon: ""
            logo: ""
            keywords:
                - Mou1ght
                - Blog
    bottom_extra:
        html: ""
        css: ""
    board:
        question: ""
        answer: ""
        need_reviewed: true
database:
    # 方式一（默认，SQLite）：库文件在 data/ 目录下（容器内对应 /app/data 卷，避免重建丢数据）
    # dsn: data/Mou1ght
    # type: sqlite
    #
    # 方式二（独立 PostgreSQL 容器）：dsn 填 libpq 连接串，host 用 compose 服务名 db
    # dsn: host=db user=mou1ght password=change-me dbname=mou1ght port=5432 sslmode=disable
    # type: postgres
    dsn: data/Mou1ght
    type: sqlite
security:
    jwt_key: ""
    visitor_jwt_key: ""
client:
    # 前台 Next.js 的按需缓存失效 webhook；留空则不通知（前台靠 ISR 周期过期）。
    # 生产环境（docker-compose）：http://client:3000/api/revalidate
    revalidate_url: ""
    # 与前台 REVALIDATE_SECRET 环境变量一致
    revalidate_secret: ""
