            - type: internal
              href: "/"
              label: home
            - type: internal
              href: "/board"
              label: board
            - type: internal
              href: "/sharings"
              label: sharings
        website_information:
            title: Mou1ght
            icon: ""
            logo: ""
            keywords:
                - Mou1ght
                - Blog
    bottom_extra:
        html: ""
        css: ""
    board:
        question: ""
        answer: ""
        need_reviewed: true
database:
    # SQLite：库文件在 data/ 目录下（容器内对应 /app/data 卷，避免重建丢数据）；
    # PostgreSQL：这里填 libpq 连接串（host=... dbname=...）
    dsn: data/Mou1ght
    type: sqlite
security:
    jwt_key: ""
    visitor_jwt_key: ""
client:
    # 前台 Next.js 的按需缓存失效 webhook；留空则不通知（前台靠 ISR 周期过期）。
    # 生产环境（docker-compose）：http://client:3000/api/revalidate
    revalidate_url: ""
    # 与前台 REVALIDATE_SECRET 环境变量一致
    revalidate_secret: ""
