name: Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # Docker Hub 用户名（公开信息，写死以便日志排查；token 才是敏感信息走 secret）
  IMAGE_NAMESPACE: yoaken
  IMAGE_BACKEND: mou1ght-backend
  IMAGE_CLIENT: mou1ght-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # frontend 是 git 子模块，必须递归检出，否则 Docker 构建上下文里没有前端源码
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: yoaken
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 打两个 tag：latest + (版本号/短 SHA)
      - name: Compute image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA:0:8}"
          if [ "${GITHUB_REF_TYPE}" == "tag" ]; then
            SUFFIX="${GITHUB_REF_NAME},${SHA}"
          else
            SUFFIX="${SHA}"
          fi
          NS="${IMAGE_NAMESPACE}"
          echo "backend=${NS}/${IMAGE_BACKEND}:latest,${NS}/${IMAGE_BACKEND}:${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "client=${NS}/${IMAGE_CLIENT}:latest,${NS}/${IMAGE_CLIENT}:${SUFFIX}" >> "$GITHUB_OUTPUT"

      # 后端镜像：Dockerfile 多阶段（先构建 admin 前端，再 embed 进 Go 二进制）
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push client
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/client
          push: true
          tags: ${{ steps.meta.outputs.client }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
