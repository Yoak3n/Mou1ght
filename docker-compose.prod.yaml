services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 证书由 certbot 写入宿主 ./nginx/certs，nginx 只读共享，自动续签直接生效
      - ./nginx/certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
      - client:
          # 等 client 健康再启动，避免启动瞬间 DNS 竞争报 "host not found in upstream client"
          condition: service_healthy
    # certbot 每 12h 检查续签，nginx 每 12h 重载一次让新证书生效（零停机）；
    # $$! 是 compose 对 shell $! 的转义（后台 nginx 的 PID）
    entrypoint: ["/bin/sh", "-c"]
    command: ["/docker-entrypoint.sh nginx -g 'daemon off;' & trap 'exit 0' TERM INT; while :; do sleep 12h; nginx -s reload 2>/dev/null || true; done; wait $$!;"]
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $$!; certbot renew --webroot -w /var/www/certbot --quiet; done;'"

  backend:
    # 服务器部署：docker compose pull 直接拉取镜像（由 GitHub Actions 推送到 Docker Hub）；
    # 本地/调试：docker compose build 仍会从 build 上下文构建
    image: ${DOCKERHUB_USERNAME:-mou1ght}/mou1ght-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "10420"
    environment:
      # 建议显式固定 JWT 密钥；留空则由后端生成并写回 config.yaml（需可写挂载）
      - JWT_KEY=${JWT_KEY:-}
      - VISITOR_JWT_KEY=${VISITOR_JWT_KEY:-}
    volumes:
      # 附件等静态数据（upload）仍落在 /app/data 卷
      - mou1ght-data:/app/data
      # 去掉 :ro：后端会把生成的 JWT 密钥与站点设置写回 config.yaml（同一份文件，跨重启持久）
      - ./config.yaml:/app/config.yaml
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 独立 PostgreSQL 数据库（可选：不想要 sqlite 时使用）
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mou1ght}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mou1ght-pass}
      - POSTGRES_DB=${POSTGRES_DB:-mou1ght}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mou1ght} -d ${POSTGRES_DB:-mou1ght}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  client:
    image: ${DOCKERHUB_USERNAME:-mou1ght}/mou1ght-client:${IMAGE_TAG:-latest}
    build:
      context: ./frontend/client
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - BASE_URL=http://backend:10420
      - REVALIDATE_SECRET=${REVALIDATE_SECRET:-please-change-me}
      # sitemap / RSS 等生成的公网地址，必须改成你的实际域名
      - SITE_URL=${SITE_URL:-https://your-domain.com}
    depends_on:
      - backend
    # client 是静态渲染的 Next.js，busybox wget 探测根路径即可
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  mou1ght-data:
  postgres-data:
  certbot-webroot:
